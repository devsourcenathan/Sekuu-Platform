# Modèle : `${PORT}` est substitué au démarrage par l'entrypoint, Render
# imposant le port par cette variable.

daemon off;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Les journaux vont sur la sortie standard : le disque d'un conteneur Render
    # est éphémère, un fichier de log y disparaît à chaque déploiement.
    access_log /dev/stdout;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Les réponses de l'API sont du JSON, souvent volumineux sur les listes.
    gzip on;
    gzip_types application/json application/javascript text/css text/plain;
    gzip_min_length 1024;

    # Un corps de requête est au plus un envoi groupé de notifications.
    client_max_body_size 16M;

    server {
        listen ${PORT};
        server_name _;

        # **Jamais la racine du dépôt.** `.env`, `storage/` et les clés doivent
        # rester hors d'atteinte du web.
        root /var/www/html/public;
        index index.php;

        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Rien à servir : la plateforme est une API.
        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

            # Un paiement attend l'agrégateur : 20 s de délai côté adaptateur,
            # plus la marge du reste de la requête.
            fastcgi_read_timeout 60s;
        }

        # Un fichier caché servi par erreur, c'est un `.env` publié.
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
