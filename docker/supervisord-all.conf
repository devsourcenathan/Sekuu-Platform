# Tout dans un seul conteneur : nginx, php-fpm, le worker de files et
# l'ordonnanceur.
#
# **Pour l'offre gratuite de Render**, qui ne propose pas de background worker.
# La configuration de production reste `supervisord.conf`, avec trois services
# séparés — voir docs/06-operations/05-free-tier.md pour ce que ce choix coûte.
#
# Ici tous les programmes redémarrent d'eux-mêmes : `queue:work --max-time`
# **sort volontairement** au bout d'une heure, et un conteneur qui mourrait à
# chaque cycle serait indéfendable.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Porte les envois de Notify et les webhooks sortants de Payments.
[program:queue]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --timeout=90
directory=/var/www/html
user=www-data
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# `payments:reconcile` toutes les cinq minutes, `billing:advance` chaque nuit.
#
# Une seule instance, et c'est structurel ici : il n'y a qu'un conteneur. Sur
# l'offre payante, où le web peut être répliqué, l'ordonnanceur doit rester un
# service à part pour la même raison.
[program:scheduler]
command=php /var/www/html/artisan schedule:work
directory=/var/www/html
user=www-data
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
