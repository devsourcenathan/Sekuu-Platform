# nginx et php-fpm dans un même conteneur.
#
# Render n'exécute qu'un processus par service : supervisord tient les deux, et
# **s'arrête si l'un meurt** — sinon le conteneur resterait « vivant » avec un
# nginx qui répond 502 à tout, et Render ne le redémarrerait pas.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize
# Supervisor ne transmet pas `HOME` lorsqu'il change d'utilisateur : sans cette
# ligne, libpq le cherche dans `/root` et la connexion TLS echoue.
environment=HOME="/var/www/html"
autorestart=false
startretries=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx
autorestart=false
startretries=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Arrête tout le groupe dès qu'un programme se termine : le conteneur meurt,
# Render le remplace.
[eventlistener:quit_on_failure]
events=PROCESS_STATE_FATAL,PROCESS_STATE_EXITED
command=sh -c 'printf "READY\n"; while read line; do kill -SIGQUIT $PPID; printf "RESULT 2\nOK"; done'
