; Worker de files de Sekuu Platform — configuration Supervisor.
;
; À copier dans /etc/supervisor/conf.d/, puis :
;   supervisorctl reread && supervisorctl update && supervisorctl start sekuu-worker:*
;
; ## Pourquoi ce worker n'est pas optionnel
;
; Il porte les envois de Notify **et les webhooks sortants de Payments**. Sans
; lui, un produit externe n'apprend jamais ses encaissements autrement qu'en
; sondant — et un client peut rester payé sans service jusqu'à sa réclamation.
;
; @see docs/06-operations/01-go-live.md

[program:sekuu-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/sekuu-platform/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
directory=/var/www/sekuu-platform
autostart=true
autorestart=true

; L'utilisateur du serveur web, pas root : le worker écrit dans storage/ et
; lit le .env, rien d'autre.
user=www-data

; Deux processus suffisent au volume actuel. Les augmenter avant d'en avoir
; besoin multiplie surtout les connexions PostgreSQL.
numprocs=2

; `--max-time=3600` fait redémarrer chaque processus toutes les heures : un
; worker de longue durée garde en mémoire la configuration chargée à son
; démarrage, et ne verrait jamais un déploiement.
;
; Un déploiement doit malgré tout appeler `php artisan queue:restart` : sans
; cela, une tâche enfilée avec l'ancien code peut s'exécuter avec le nouveau.
stopwaitsecs=3600

redirect_stderr=true
stdout_logfile=/var/www/sekuu-platform/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

stopasgroup=true
killasgroup=true
